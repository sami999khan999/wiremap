# The image's own rules, restated, plus one: a standby on the compose network may stream.
# Mounted with `hba_file` rather than written into the volume, so an existing volume gets
# it too — see docs/infra/reference/postgres.md.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    replication     all             all                     scram-sha-256
host    all             all             all                     scram-sha-256
