name: lite

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    # pg_stat_statements is the measurement that answers "which query" before any move on
    # the scaling ladder. max_connections is sized for the pooler, not for the apps.
    # max_locks_per_transaction is raised off the default 64 because every tenant is
    # partitions: a statement the planner cannot prune by tenant locks every leaf and its
    # indexes, ~112 per tenant for `notifications` at full retention. 1024 x 200 slots is
    # one such read at ~1 800 tenants. See packages/infrastructure/docs/reference/partitions.md.
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "track_io_timing=on",
        "-c",
        "max_connections=200",
        "-c",
        "max_locks_per_transaction=1024",
      ]
    environment:
      POSTGRES_USER: ratchet
      POSTGRES_PASSWORD: ratchet
      POSTGRES_DB: ratchet
    ports: ["${POSTGRES_PORT:-25432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres.init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratchet -d ratchet"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One instance for the cache, the queue and realtime. It holds BullMQ's jobs, so it is
  # durable and never evicts: every cache key carries a TTL instead. See data.md.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports: ["${REDIS_PORT:-26379}:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-21025}:1025"
      - "${MAILPIT_UI_PORT:-28025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    # MinIO withdrew the community images from Docker Hub and Quay in October 2025, so
    # `minio/minio` no longer resolves. This is a rebuild of that final release.
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ratchet
      MINIO_ROOT_PASSWORD: ratchetsecret
    ports: ["${S3_PORT:-29000}:9000", "${MINIO_CONSOLE_PORT:-29001}:9001"]
    volumes:
      - miniodata:/data
    # No healthcheck, and that is the second time this service has had one it could not
    # run: `mc ready local` needed a binary the server image lacks, and so does `curl`.
    # `minio-init` waits for the API itself, which depends on no binary being anywhere.

  minio-init:
    # `mc` went with the server image. Bitnami's archive still carries the binary, and
    # the entrypoint below is ours, so only `mc` being on PATH matters.
    image: bitnamilegacy/minio-client:latest
    # One-shot: it creates buckets and exits 0. Without this the default policy keeps
    # restarting a container whose whole job is to finish.
    restart: "no"
    depends_on: [minio]
    environment:
      # `mc alias set` writes config under $HOME, which is not writable in every image.
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ratchet ratchetsecret; do sleep 2; done &&
      mc mb --ignore-existing local/ratchet &&
      mc anonymous set none local/ratchet &&
      echo 'buckets ready'
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
