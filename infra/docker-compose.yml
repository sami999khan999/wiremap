name: lite

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    # pg_stat_statements is the measurement that answers "which query" before any move on
    # the scaling ladder. max_connections is sized for the pooler, not for the apps.
    # max_locks_per_transaction is raised off the default 64 because every tenant is
    # partitions: a statement the planner cannot prune by tenant locks every leaf and its
    # indexes, ~112 per tenant for `notifications` at full retention. 1024 x 200 slots is
    # one such read at ~1 800 tenants. See packages/infrastructure/docs/reference/partitions.md.
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "track_io_timing=on",
        "-c",
        "max_connections=200",
        "-c",
        "max_locks_per_transaction=1024",
        "-c",
        "hba_file=/etc/postgresql/pg_hba.conf",
      ]
    environment:
      POSTGRES_USER: ratchet
      POSTGRES_PASSWORD: ratchet
      POSTGRES_DB: ratchet
    ports: ["${POSTGRES_PORT:-25432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres.init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      # The image's rules plus `replication` from the network, for `postgres-replica`.
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratchet -d ratchet"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Transaction mode: a server connection is held for the length of a transaction and no
  # longer, which is what lets many app connections share few Postgres ones.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ratchet
      DB_PASSWORD: ratchet
      DB_NAME: ratchet
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      MIN_POOL_SIZE: "0"
      RESERVE_POOL_SIZE: "5"
      SERVER_RESET_QUERY: DISCARD ALL
      # Without `statement_timeout` here pgBouncer refuses every connection this app
      # makes: `pg` sends it at startup. Ignored means dropped — migration 0022 is the
      # replacement floor. See docs/infra/reference/pgbouncer.md.
      IGNORE_STARTUP_PARAMETERS: statement_timeout,lock_timeout,idle_in_transaction_session_timeout,extra_float_digits
      # So `RECONNECT` and `SHOW POOLS` can be issued against the `pgbouncer` database.
      ADMIN_USERS: ratchet
    # 5432 inside the container, not 6432: this image's own `listen_port` is the Postgres
    # default, and a healthcheck on 6432 would report unhealthy forever.
    ports: ["${PGBOUNCER_PORT:-26432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ratchet"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Node 0's streaming standby, behind the `replica` profile — `24.3`. Cloned from the
  # primary on an empty volume, then read-only for as long as it runs.
  postgres-replica:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    profiles: ["replica"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ratchet
      PGDATA: /var/lib/postgresql/data
    # `pg_basebackup -R` writes `standby.signal` and the connection, so the image's own
    # entrypoint finds a data directory and starts a standby rather than running initdb.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          mkdir -p "$$PGDATA" && chown postgres "$$PGDATA" && chmod 0700 "$$PGDATA"
          gosu postgres pg_basebackup -h postgres -U ratchet -D "$$PGDATA" -R -X stream -c fast
        fi
        exec docker-entrypoint.sh "$$@"
      - postgres-replica
    # A hot standby refuses to start below the primary's `max_connections` and
    # `max_locks_per_transaction`, so it carries the same settings.
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "track_io_timing=on",
        "-c",
        "max_connections=200",
        "-c",
        "max_locks_per_transaction=1024",
        "-c",
        "hot_standby_feedback=on",
      ]
    ports: ["${POSTGRES_REPLICA_PORT:-25434}:5432"]
    volumes:
      - pgreplicadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratchet -d ratchet"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    # `--maxmemory` is what makes the policy reachable: the default is 0, meaning no
    # ceiling, so `allkeys-lru` never evicts and the container is OOM-killed instead.
    command:
      [
        "redis-server",
        "--save",
        "",
        "--maxmemory",
        "${REDIS_CACHE_MAXMEMORY:-256mb}",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    ports: ["${REDIS_CACHE_PORT:-26379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports: ["${REDIS_QUEUE_PORT:-26380}:6379"]
    volumes:
      - redisqueuedata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-21025}:1025"
      - "${MAILPIT_UI_PORT:-28025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    # MinIO withdrew the community images from Docker Hub and Quay in October 2025, so
    # `minio/minio` no longer resolves. This is a rebuild of that final release.
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ratchet
      MINIO_ROOT_PASSWORD: ratchetsecret
    ports: ["${S3_PORT:-29000}:9000", "${MINIO_CONSOLE_PORT:-29001}:9001"]
    volumes:
      - miniodata:/data
    # No healthcheck, and that is the second time this service has had one it could not
    # run: `mc ready local` needed a binary the server image lacks, and so does `curl`.
    # `minio-init` waits for the API itself, which depends on no binary being anywhere.

  minio-init:
    # `mc` went with the server image. Bitnami's archive still carries the binary, and
    # the entrypoint below is ours, so only `mc` being on PATH matters.
    image: bitnamilegacy/minio-client:latest
    # One-shot: it creates buckets and exits 0. Without this the default policy keeps
    # restarting a container whose whole job is to finish.
    restart: "no"
    depends_on: [minio]
    environment:
      # `mc alias set` writes config under $HOME, which is not writable in every image.
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ratchet ratchetsecret; do sleep 2; done &&
      mc mb --ignore-existing local/ratchet &&
      mc mb --ignore-existing local/loki &&
      mc anonymous set none local/ratchet &&
      mc anonymous set none local/loki &&
      echo 'buckets ready'
      "

  # The colder tier `25.3` transitions archived months to, behind the `cold-tier` profile.
  # A second MinIO, because MinIO has no storage classes of its own — only remote tiers.
  minio-cold:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    profiles: ["cold-tier"]
    command: server /data
    environment:
      MINIO_ROOT_USER: ratchet
      MINIO_ROOT_PASSWORD: ratchetsecret
    volumes:
      - miniocolddata:/data

  # One-shot, like `minio-init`: the tier's bucket, then the tier registered on `minio`
  # as `COLD`. `tier ls | grep`, because `tier info` exits 0 for a tier that is absent.
  minio-cold-init:
    image: bitnamilegacy/minio-client:latest
    restart: "no"
    profiles: ["cold-tier"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
      minio-cold:
        condition: service_started
    environment:
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint: >
      /bin/sh -c "
      until mc alias set cold http://minio-cold:9000 ratchet ratchetsecret; do sleep 2; done &&
      until mc alias set local http://minio:9000 ratchet ratchetsecret; do sleep 2; done &&
      mc mb --ignore-existing cold/tier &&
      (mc ilm tier ls local | grep -q COLD || mc ilm tier add minio local COLD --endpoint http://minio-cold:9000 --access-key ratchet --secret-key ratchetsecret --bucket tier) &&
      echo 'cold tier ready'
      "

  loki:
    image: grafana/loki:3.3.2
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    ports: ["${LOKI_PORT:-23100}:3100"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./loki.config.yml:/etc/loki/config.yml:ro
      - lokidata:/loki
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 3s
      retries: 20

  alloy:
    image: grafana/alloy:v1.5.1
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports: ["${ALLOY_PORT:-12345}:12345"]
    depends_on:
      loki:
        condition: service_healthy
    # The socket below is root:docker on Linux and Alloy does not run as root, so
    # without the group it collects nothing and says nothing about why.
    group_add:
      - ${DOCKER_GID:-999}
    volumes:
      - ./alloy.config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/var/log/app:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/12345"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  pgreplicadata:
  redisqueuedata:
  miniodata:
  miniocolddata:
  lokidata:
