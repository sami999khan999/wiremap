# wiremap with the stores in their own containers: `docker compose -f docker/wiremap/compose.yml up -d`.
# The same image as the single container, told to use these stores (WIREMAP_EXTERNAL_STORES=1).
# Put POSTGRES_PASSWORD and MINIO_PASSWORD in docker/wiremap/.env first; it is gitignored.
name: wiremap-app

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: wiremap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/wiremap/.env}
      POSTGRES_DB: wiremap
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wiremap", "-d", "wiremap"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # The job queue lives here: AOF so a restart keeps it, never evict.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: wiremap
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in docker/wiremap/.env}
      MINIO_BROWSER: "off"
    volumes: [minio:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  # Catches every message until SMTP_URL points somewhere real. Its inbox is on 48025.
  mailpit:
    image: axllent/mailpit:v1.29
    ports: ["127.0.0.1:${MAILPIT_PORT:-48025}:8025"]
    restart: unless-stopped

  wiremap:
    build:
      context: ../..
      dockerfile: docker/wiremap/Dockerfile
    image: wiremap
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      WIREMAP_EXTERNAL_STORES: "1"
      DATABASE_URL: postgres://wiremap:${POSTGRES_PASSWORD}@postgres:5432/wiremap
      REDIS_CACHE_URL: redis://redis:6379
      REDIS_QUEUE_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: wiremap
      S3_SECRET_KEY: ${MINIO_PASSWORD}
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
    # The GitHub App, SMTP and the tunnel go in the same .env as the passwords.
    env_file:
      - path: .env
        required: false
    ports: ["127.0.0.1:${WIREMAP_PORT:-43000}:43000"]
    volumes: [wiremap:/data]
    restart: unless-stopped

volumes:
  postgres:
  redis:
  minio:
  wiremap:
